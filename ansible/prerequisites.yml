---
- name: OS prerequisites for Kubernetes
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Disable swap now
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Remove swap from fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Set SELinux permissive now
      ansible.builtin.command: setenforce 0
      when: ansible_selinux.status == 'enabled' and ansible_selinux.mode == 'enforcing'

    - name: Set SELinux permissive permanently
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: SELINUX=permissive

    - name: Install extra kernel modules and network tools
      ansible.builtin.dnf:
        name:
          - kernel-modules-extra
          - iptables-nft
          - conntrack-tools
        state: present

    - name: Persist kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Load kernel modules now
      ansible.builtin.command: "modprobe {{ item }}"
      loop:
        - overlay
        - br_netfilter
      changed_when: false

    - name: Set sysctl parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
      notify: Reload sysctl

    - name: Apply sysctl now
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system

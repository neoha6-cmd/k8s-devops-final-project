---
- name: Refresh the join command on the control plane
  hosts: k8s_master
  become: true
  tasks:
    - name: Generate the join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false

    - name: Store the join command
      ansible.builtin.set_fact:
        kube_join_command: "{{ join_cmd.stdout }}"

- name: Join worker nodes to the cluster
  hosts: k8s_workers
  become: true
  tasks:
    - name: Check if the node already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join the cluster
      ansible.builtin.command: "{{ hostvars['k8slab-cp1'].kube_join_command }}"
      when: not kubelet_conf.stat.exists

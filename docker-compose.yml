services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasks_pass}
      POSTGRES_DB: tasks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./app
      args:
        APP_VERSION: "1.0.0"
    environment:
      DATABASE_URL: postgresql+psycopg2://tasks:${POSTGRES_PASSWORD:-tasks_pass}@db:5432/tasks
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
